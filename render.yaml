services:
  - type: web
    name: pbs-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt -r requirements-postgres.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
